name: Build WorldScope

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build --no-daemon

      - name: Read mod version
        id: mod-version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read mod_version from gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldScope-Fabric-26.2
          path: build/libs/*.jar

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'Bump WorldScope') || contains(github.event.head_commit.message, 'Refresh WorldScope')))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.mod-version.outputs.version }}
          name: WorldScope v${{ steps.mod-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          files: build/libs/worldscope-${{ steps.mod-version.outputs.version }}.jar
